<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>DevOps in a nutshell</title>

    <!-- Reveal.js Latest (v5) via jsDelivr CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css" id="theme">

    <!-- Theme used for syntax highlighting of code -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css">

    <!-- Custom Modern Dark DevOps Theme -->
    <link rel="stylesheet" href="css/custom.css?v=3">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="slides/title.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/introduction.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/agilite.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/devops.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/equipe.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/cintegration.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/cdelivery.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/cdeployment.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/coperations.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/ceverything.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/conclusion.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>

    <script>
      Reveal.initialize({
        width: 1280,
        height: 740,
        margin: 0.06,
        controls: true,
        progress: true,
        history: true,
        hash: true,
        center: true,
        slideNumber: 'c/t',
        transition: 'slide',
        backgroundTransition: 'fade',
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
      }).then(() => {
        let partCounter = 0;

        document.querySelectorAll('.reveal .slides section').forEach((section) => {
          // Skip vertical stack wrapper sections
          if (section.querySelector('section')) return;

          const h1 = section.querySelector('h1');
          const h2 = section.querySelector('h2');
          const imgs = Array.from(section.querySelectorAll('img'));
          const topLists = Array.from(section.querySelectorAll(':scope > ul'));
          const blockquotes = Array.from(section.querySelectorAll('blockquote'));

          // Classify images
          imgs.forEach((img) => {
            const src = img.getAttribute('src') || '';
            if (src.includes('devops-infinity-workflow')) {
              img.classList.add('infinity-img');
            } else if (src.includes('pbs.twimg.com') || img.classList.contains('avatar-img')) {
              img.classList.add('avatar-img');
            } else if (src.includes('.svg')) {
              img.classList.add('diagram-svg');
            } else {
              img.classList.add('diagram-light');
            }
          });

          // Add badges & center cover/title slides
          if (h1) {
            section.classList.add('center-slide');
            const badgeWrap = document.createElement('div');
            badgeWrap.className = 'section-badge-wrap';
            badgeWrap.innerHTML = '<span class="section-badge">Training & Culture</span>';
            section.insertBefore(badgeWrap, h1);
          } else if (h2 && topLists.length === 0 && blockquotes.length === 0 && imgs.length === 0) {
            partCounter += 1;
            section.classList.add('center-slide');
            const badgeWrap = document.createElement('div');
            badgeWrap.className = 'section-badge-wrap';
            const num = String(partCounter).padStart(2, '0');
            badgeWrap.innerHTML = `<span class="section-badge">Part ${num}</span>`;
            section.insertBefore(badgeWrap, h2);
          } else if (h2 && h2.textContent.trim().toLowerCase().includes('conclusion')) {
            const badgeWrap = document.createElement('div');
            badgeWrap.className = 'section-badge-wrap';
            badgeWrap.innerHTML = '<span class="section-badge">Conclusion</span>';
            section.insertBefore(badgeWrap, h2);
          }

          // Center question-only slides, profile slide, and diagram-only slides
          if (topLists.length === 0 && blockquotes.length === 0) {
            section.classList.add('center-slide');
          } else if (imgs.some((img) => img.classList.contains('avatar-img'))) {
            section.classList.add('center-slide');
          }

          if (imgs.length > 0 && topLists.length > 0) {
            section.classList.add('has-img-and-list');
          }

          // Enhance top-level lists into grids or compact lists
          topLists.forEach((ul) => {
            const items = Array.from(ul.children).filter((el) => el.tagName === 'LI');
            const hasNestedList = items.some((li) => li.querySelector('ul, ol'));
            const maxLen = Math.max(0, ...items.map((li) => (li.textContent || '').trim().length));

            if (items.length === 5 && maxLen <= 20 && !hasNestedList) {
              ul.classList.add('grid-5');
            } else if (items.length === 3 && maxLen <= 35 && !hasNestedList && imgs.length === 0) {
              ul.classList.add('grid-3');
            } else if (items.length === 4 && maxLen <= 65 && !hasNestedList && imgs.length === 0) {
              ul.classList.add('grid-2');
            } else if (items.length === 2 && maxLen <= 45 && !hasNestedList && imgs.length === 0) {
              ul.classList.add('grid-2');
            } else if (items.length >= 5) {
              ul.classList.add('compact-list');
            }
          });
        });

        Reveal.layout();
      });
    </script>
  </body>
</html>

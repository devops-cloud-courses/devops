<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="plActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="plHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="plShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="380" rx="16" fill="#f8fafc"/>

  <line x1="400" y1="94" x2="400" y2="183" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="528" y1="94" x2="528" y2="273" stroke="#059669" stroke-width="2" stroke-dasharray="7 6"/>

  <g filter="url(#plShadow)">
    <polygon points="24,24 138,24 156,54 138,84 24,84 42,54" fill="url(#plActive)"/>
    <text x="90.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Plan</text>
    <polygon points="152,24 266,24 284,54 266,84 152,84 170,54" fill="url(#plActive)"/>
    <text x="218.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Code</text>
    <polygon points="280,24 394,24 412,54 394,84 280,84 298,54" fill="url(#plActive)"/>
    <text x="346.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Build</text>
    <polygon points="408,24 522,24 540,54 522,84 408,84 426,54" fill="url(#plHighlight)"/>
    <text x="474.0" y="60" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Test</text>
    <polygon points="536,24 650,24 668,54 650,84 536,84 554,54" fill="#cbd5e1"/>
    <text x="602.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">Release</text>
    <polygon points="664,24 778,24 796,54 778,84 664,84 682,54" fill="#cbd5e1"/>
    <text x="730.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">Deploy</text>
    <polygon points="792,24 906,24 924,54 906,84 792,84 810,54" fill="#cbd5e1"/>
    <text x="858.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">Operate</text>
  </g>

  <text x="214.0" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Agile Development</text>
  <line x1="38" y1="165" x2="382" y2="165" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="28,165 39,159.5 39,170.5" fill="#64748b"/>
  <polygon points="392,165 381,159.5 381,170.5" fill="#64748b"/>
  <text x="278.0" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#065f46">Continuous Integration</text>
  <line x1="38" y1="255" x2="510" y2="255" stroke="#059669" stroke-width="3"/>
  <polygon points="28,255 39,249.5 39,260.5" fill="#059669"/>
  <polygon points="520,255 509,249.5 509,260.5" fill="#059669"/>
</svg>

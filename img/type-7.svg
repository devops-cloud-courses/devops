<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 15 690 285" width="690" height="285" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="tpDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.15" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <radialGradient id="gradDev" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.88"/>
    </radialGradient>
    <radialGradient id="gradOps" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#eef2ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.88"/>
    </radialGradient>
    <radialGradient id="gradAnti" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1f2" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0.90"/>
    </radialGradient>
    <radialGradient id="gradDevOps" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.88"/>
    </radialGradient>
    <radialGradient id="gradDBA" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.90"/>
    </radialGradient>
    <radialGradient id="gradSRE" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.88"/>
    </radialGradient>
    <filter id="tpShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="legShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect x="55" y="15" width="690" height="285" rx="18" fill="#f8fafc"/>
  <rect x="55" y="15" width="690" height="285" rx="18" fill="url(#tpDots)"/>
  <g filter="url(#tpShadow)">

    <circle cx="170" cy="130" r="88" fill="url(#gradDev)" stroke="#2563eb" stroke-width="3"/>
    <text x="142" y="138" font-size="25" font-weight="800" fill="#1e3a8a" text-anchor="middle">Dev</text>

    <circle cx="485" cy="130" r="88" fill="url(#gradSRE)" stroke="#0891b2" stroke-width="3"/>
    <circle cx="622" cy="130" r="88" fill="url(#gradOps)" fill-opacity="0.78" stroke="#4f46e5" stroke-width="3"/>
    <text x="488" y="138" font-size="25" font-weight="800" fill="#164e63" text-anchor="middle">SRE</text>
    <text x="648" y="138" font-size="25" font-weight="800" fill="#312e81" text-anchor="middle">Ops</text>

    <ellipse cx="322" cy="130" rx="120" ry="38" fill="url(#gradDevOps)" fill-opacity="0.82" stroke="#059669" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="322" y="136" font-size="19" font-weight="800" fill="#065f46" text-anchor="middle">DevOps</text>

  </g>
  <g filter="url(#legShadow)">
    <rect x="155.0" y="256" width="490.0" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="198.0" cy="273" r="7.5" fill="url(#gradDev)" stroke="#2563eb" stroke-width="2.2"/>
    <text x="212.0" y="278" font-size="13.5" font-weight="700" fill="#334155">Dev</text>
    <circle cx="318.0" cy="273" r="7.5" fill="url(#gradDevOps)" stroke="#059669" stroke-width="2.2"/>
    <text x="332.0" y="278" font-size="13.5" font-weight="700" fill="#334155">DevOps</text>
    <circle cx="438.0" cy="273" r="7.5" fill="url(#gradSRE)" stroke="#0891b2" stroke-width="2.2"/>
    <text x="452.0" y="278" font-size="13.5" font-weight="700" fill="#334155">SRE</text>
    <circle cx="558.0" cy="273" r="7.5" fill="url(#gradOps)" stroke="#4f46e5" stroke-width="2.2"/>
    <text x="572.0" y="278" font-size="13.5" font-weight="700" fill="#334155">Ops</text>
  </g>
</svg>

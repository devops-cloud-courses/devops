  </defs>

  <rect width="960" height="380" rx="16" fill="#f8fafc"/>

  <line x1="400" y1="94" x2="400" y2="158" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="528" y1="94" x2="528" y2="222" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="656" y1="94" x2="656" y2="286" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="784" y1="94" x2="784" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="7 6"/>

  <g filter="url(#plShadow)">
    <polygon points="24,24 138,24 156,54 138,84 24,84 42,54" fill="url(#plActive)"/>
    <text x="90.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Plan</text>
    <polygon points="152,24 266,24 284,54 266,84 152,84 170,54" fill="url(#plActive)"/>
    <text x="218.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Code</text>
    <polygon points="280,24 394,24 412,54 394,84 280,84 298,54" fill="url(#plActive)"/>
    <text x="346.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Build</text>
    <polygon points="408,24 522,24 540,54 522,84 408,84 426,54" fill="url(#plActive)"/>
    <text x="474.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Test</text>
    <polygon points="536,24 650,24 668,54 650,84 536,84 554,54" fill="url(#plActive)"/>
    <text x="602.0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Release</text>
    <polygon points="664,24 778,24 796,54 778,84 664,84 682,54" fill="url(#plHighlight)"/>
    <text x="730.0" y="60" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Deploy</text>

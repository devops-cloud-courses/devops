    <text x="220.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#bfdbfe">02</text>
    <text x="220.0" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Code</text>
    <polygon points="280,22 394,22 412,56 394,90 280,90 298,56" fill="url(#plActive)"/>
    <text x="348.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#bfdbfe">03</text>
    <text x="348.0" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Build</text>
    <polygon points="408,22 522,22 540,56 522,90 408,90 426,56" fill="url(#plActive)"/>
    <text x="476.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#bfdbfe">04</text>
    <text x="476.0" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Test</text>
    <polygon points="536,22 650,22 668,56 650,90 536,90 554,56" fill="url(#plActive)"/>
    <text x="604.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#bfdbfe">05</text>
    <text x="604.0" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Release</text>

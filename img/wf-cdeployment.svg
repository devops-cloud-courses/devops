    <text x="860.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#94a3b8">07</text>
    <text x="860.0" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">Operate</text>

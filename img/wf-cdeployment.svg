<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="plDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="plActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="plHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="plShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="plTrackShadow" x="-4%" y="-10%" width="108%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="960" height="380" rx="18" fill="#f8fafc"/>
  <rect width="960" height="380" rx="18" fill="url(#plDots)"/>

  <line x1="400" y1="96" x2="400" y2="158" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="528" y1="96" x2="528" y2="218" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="656" y1="96" x2="656" y2="278" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="784" y1="96" x2="784" y2="338" stroke="#10b981" stroke-width="2" stroke-dasharray="6 5"/>


    <text x="732.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#a7f3d0">06</text>
    <text x="732.0" y="69" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Deploy</text>

  <polygon points="42,260 52,255 52,265" fill="#64748b"/>
  <polygon points="642,260 632,255 632,265" fill="#64748b"/>
  <rect x="237.6" y="246" width="208.8" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="342.0" y="265" text-anchor="middle" font-size="13.5" font-weight="800" fill="#334155">Continuous Delivery</text>
  <g filter="url(#plTrackShadow)">

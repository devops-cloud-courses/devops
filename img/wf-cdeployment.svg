  <line x1="50" y1="320" x2="762" y2="320" stroke="#059669" stroke-width="2.5"/>
  <polygon points="42,320 52,315 52,325" fill="#059669"/>
  <polygon points="770,320 760,315 760,325" fill="#059669"/>
  <rect x="292.4" y="306" width="227.2" height="28" rx="14" fill="#059669" stroke="#6ee7b7" stroke-width="1"/>
  <text x="406.0" y="325" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Continuous Deployment</text>

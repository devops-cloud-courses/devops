<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="cdp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="cdp-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cdp-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="992" height="382" rx="18" fill="url(#cdp-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- 7 Stage Boxes: Plan..Deploy active, Operate muted -->
  <rect x="28" y="28" width="124" height="56" rx="10" fill="url(#cdp-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="62" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Plan</text>

  <rect x="164" y="28" width="124" height="56" rx="10" fill="url(#cdp-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="226" y="62" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Code</text>

  <rect x="300" y="28" width="124" height="56" rx="10" fill="url(#cdp-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="362" y="62" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Build</text>

  <rect x="436" y="28" width="124" height="56" rx="10" fill="url(#cdp-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="498" y="62" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Test</text>

  <rect x="572" y="28" width="124" height="56" rx="10" fill="url(#cdp-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="634" y="62" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Release</text>

  <!-- Stage 6: Deploy (Highlighted target stage) -->
  <rect x="708" y="28" width="124" height="56" rx="10" fill="url(#cdp-highlight)" stroke="#ffffff" stroke-width="2"/>
  <text x="770" y="62" fill="#090d16" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Deploy</text>

  <!-- Stage 7: Operate (Muted) -->
  <rect x="844" y="28" width="128" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="908" y="62" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Operate</text>

  <!-- Vertical Dashed Guide Lines -->
  <line x1="424" y1="94" x2="424" y2="155" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="560" y1="94" x2="560" y2="220" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="696" y1="94" x2="696" y2="285" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="832" y1="94" x2="832" y2="362" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Scope 1: Agile Development -->
  <text x="226" y="128" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Agile Development</text>
  <line x1="36" y1="142" x2="416" y2="142" stroke="#64748b" stroke-width="3"/>
  <polygon points="28,142 40,136 40,148" fill="#64748b"/>
  <polygon points="424,142 412,136 412,148" fill="#64748b"/>

  <!-- Scope 2: Continuous Integration -->
  <text x="294" y="192" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Continuous Integration</text>
  <line x1="36" y1="206" x2="552" y2="206" stroke="#64748b" stroke-width="3"/>
  <polygon points="28,206 40,200 40,212" fill="#64748b"/>
  <polygon points="560,206 548,200 548,212" fill="#64748b"/>

  <!-- Scope 3: Continuous Delivery -->
  <text x="362" y="256" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Continuous Delivery</text>
  <line x1="36" y1="270" x2="688" y2="270" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="28,270 40,264 40,276" fill="#94a3b8"/>
  <polygon points="696,270 684,264 684,276" fill="#94a3b8"/>

  <!-- Scope 4: Continuous Deployment - HIGHLIGHTED -->
  <rect x="270" y="304" width="320" height="32" rx="16" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="326" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Continuous Deployment</text>
  <line x1="36" y1="350" x2="824" y2="350" stroke="#34d399" stroke-width="4"/>
  <polygon points="28,350 42,343 42,357" fill="#34d399"/>
  <polygon points="832,350 818,343 818,357" fill="#34d399"/>
</svg>

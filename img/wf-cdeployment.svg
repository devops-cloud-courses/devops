  <polygon points="28,140 39,134.5 39,145.5" fill="#64748b"/>
  <polygon points="392,140 381,134.5 381,145.5" fill="#64748b"/>
  <text x="278.0" y="193" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Continuous Integration</text>
  <line x1="38" y1="204" x2="510" y2="204" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="28,204 39,198.5 39,209.5" fill="#64748b"/>
  <polygon points="520,204 509,198.5 509,209.5" fill="#64748b"/>
  <text x="342.0" y="257" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Continuous Delivery</text>

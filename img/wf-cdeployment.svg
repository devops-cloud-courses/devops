    <text x="92.0" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#bfdbfe">01</text>
    <text x="92.0" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Plan</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <linearGradient id="inf-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="inf-ops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="inf-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Subtle Glow Track -->
  <path d="M 500 220 C 390 60, 120 60, 120 220 C 120 380, 390 380, 500 220 C 610 60, 880 60, 880 220 C 880 380, 610 380, 500 220 Z"
        fill="none" stroke="#1e293b" stroke-width="68" stroke-linecap="round"/>

  <!-- Left Loop (DEV) -->
  <path d="M 500 220 C 390 60, 120 60, 120 220 C 120 380, 390 380, 500 220"
        fill="none" stroke="url(#inf-dev)" stroke-width="50" stroke-linecap="round" filter="url(#inf-glow)"/>

  <!-- Right Loop (OPS) -->
  <path d="M 500 220 C 610 60, 880 60, 880 220 C 880 380, 610 380, 500 220"
        fill="none" stroke="url(#inf-ops)" stroke-width="50" stroke-linecap="round" filter="url(#inf-glow)"/>

  <!-- Center Labels Inside Loops -->
  <text x="275" y="215" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="0.06em">DEV</text>
  <text x="275" y="245" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" text-anchor="middle">BUILD &amp; VERIFY</text>

  <text x="725" y="215" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="0.06em">OPS</text>
  <text x="725" y="245" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" text-anchor="middle">RUN &amp; OBSERVE</text>

  <!-- 8 Stage Badges Around the Infinity Loop -->
  <!-- 1. PLAN (Top-Right of Left Loop) -->
  <rect x="330" y="78" width="110" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="385" y="102" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">1. PLAN</text>

  <!-- 2. CODE (Top-Left of Left Loop) -->
  <rect x="105" y="102" width="110" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="160" y="126" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">2. CODE</text>

  <!-- 3. BUILD (Bottom-Left of Left Loop) -->
  <rect x="105" y="300" width="114" height="38" rx="19" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <text x="162" y="324" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">3. BUILD</text>

  <!-- 4. TEST (Bottom-Right of Left Loop) -->
  <rect x="330" y="324" width="110" height="38" rx="19" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <text x="385" y="348" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">4. TEST</text>

  <!-- 5. RELEASE (Top-Left of Right Loop) -->
  <rect x="555" y="78" width="130" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <text x="620" y="102" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">5. RELEASE</text>

  <!-- 6. DEPLOY (Top-Right of Right Loop) -->
  <rect x="780" y="102" width="124" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <text x="842" y="126" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">6. DEPLOY</text>

  <!-- 7. OPERATE (Bottom-Right of Right Loop) -->
  <rect x="776" y="300" width="132" height="38" rx="19" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="842" y="324" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">7. OPERATE</text>

  <!-- 8. MONITOR (Bottom-Left of Right Loop) -->
  <rect x="555" y="324" width="132" height="38" rx="19" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="621" y="348" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">8. MONITOR</text>

  <!-- Center Continuous Feedback Node -->
  <circle cx="500" cy="220" r="28" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
  <text x="500" y="228" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">∞</text>
</svg>

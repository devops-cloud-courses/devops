<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ag-design" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ag-code" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ag-test" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="ag-deploy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="992" height="272" rx="16" fill="url(#ag-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 1: Waterfall -->
  <text x="36" y="40" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Waterfall</text>
  <rect x="36" y="54" width="145" height="62" rx="9" fill="url(#ag-design)"/>
  <text x="108.5" y="91" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Design</text>

  <rect x="193" y="54" width="469" height="62" rx="9" fill="url(#ag-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="427.5" y="91" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Code</text>

  <rect x="674" y="54" width="138" height="62" rx="9" fill="url(#ag-test)"/>
  <text x="743" y="91" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Test</text>

  <rect x="824" y="54" width="140" height="62" rx="9" fill="url(#ag-deploy)"/>
  <text x="894" y="91" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- Row 2: Agile -->
  <text x="36" y="164" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Agile (Iterative Sprints)</text>

  <!-- Sprint 1 (labeled) -->
  <rect x="36" y="178" width="128" height="62" rx="9" fill="url(#ag-design)"/>
  <text x="100" y="215" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Design</text>

  <rect x="174" y="178" width="128" height="62" rx="9" fill="url(#ag-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="238" y="215" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Code</text>

  <rect x="312" y="178" width="128" height="62" rx="9" fill="url(#ag-test)"/>
  <text x="376" y="215" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Test</text>

  <!-- Sprint 2 -->
  <rect x="452" y="178" width="54" height="62" rx="8" fill="url(#ag-design)"/>
  <rect x="514" y="178" width="54" height="62" rx="8" fill="url(#ag-code)" stroke="#475569" stroke-width="1.5"/>
  <rect x="576" y="178" width="54" height="62" rx="8" fill="url(#ag-test)"/>

  <!-- Sprint 3 -->
  <rect x="642" y="178" width="54" height="62" rx="8" fill="url(#ag-design)"/>
  <rect x="704" y="178" width="54" height="62" rx="8" fill="url(#ag-code)" stroke="#475569" stroke-width="1.5"/>
  <rect x="766" y="178" width="54" height="62" rx="8" fill="url(#ag-test)"/>

  <!-- Final Deploy -->
  <rect x="832" y="178" width="132" height="62" rx="9" fill="url(#ag-deploy)"/>
  <text x="898" y="215" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Deploy</text>
</svg>

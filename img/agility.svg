<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="960" height="275" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="dvShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="275" rx="16" fill="#f8fafc"/>

  <!-- Row 1: Waterfall -->
  <text x="32" y="42" font-size="18" font-weight="800" fill="#1e293b">Waterfall</text>

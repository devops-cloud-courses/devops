    <text x="224" y="207" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Test</text>

    <!-- Agile Iteration 2 -->
    <rect x="274" y="170" width="72" height="64" rx="8" fill="#0891b2"/>
    <text x="310" y="207" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Design</text>
    <rect x="352" y="170" width="72" height="64" rx="8" fill="#1e293b"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 15 690 285" width="690" height="285" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="tpShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="55" y="15" width="690" height="285" rx="16" fill="#f8fafc"/>
  <g filter="url(#tpShadow)">

    <!-- Outer Dev Organization Circle -->
    <circle cx="400" cy="130" r="110" fill="#dbeafe" fill-opacity="0.65" stroke="#2563eb" stroke-width="3"/>

    <!-- 4 Dev Sub-Team Circles in 2x2 Grid -->
    <circle cx="354" cy="84" r="35" fill="#bfdbfe" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="2"/>
    <text x="342" y="76" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">Dev</text>

    <circle cx="446" cy="84" r="35" fill="#bfdbfe" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="2"/>
    <text x="456" y="78" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">Dev</text>

    <circle cx="354" cy="176" r="35" fill="#bfdbfe" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="2"/>
    <text x="344" y="188" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">Dev</text>

    <circle cx="446" cy="176" r="35" fill="#bfdbfe" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="2"/>
    <text x="456" y="188" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">Dev</text>

    <!-- Overlapping DevOps Circle in Center -->
    <circle cx="400" cy="130" r="56" fill="#ffe4e6" fill-opacity="0.78" stroke="#e11d48" stroke-width="2.5"/>
    <text x="416" y="156" font-size="14" font-weight="800" fill="#881337" text-anchor="middle">DevOps</text>

    <!-- Small Embedded Ops Circle Inside Top-Left of DevOps -->
    <circle cx="380" cy="110" r="27" fill="#e0e7ff" fill-opacity="0.92" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="380" y="115" font-size="13.5" font-weight="800" fill="#312e81" text-anchor="middle">Ops</text>

  </g>
  <g>
    <circle cx="251.0" cy="280" r="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="265.0" y="285" font-size="14" font-weight="700" fill="#334155">Dev</text>
    <circle cx="376.0" cy="280" r="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="2.5"/>
    <text x="390.0" y="285" font-size="14" font-weight="700" fill="#334155">DevOps</text>
    <circle cx="501.0" cy="280" r="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="515.0" y="285" font-size="14" font-weight="700" fill="#334155">Ops</text>
  </g>

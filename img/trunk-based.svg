<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="tbDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="tbShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="240" rx="18" fill="#f8fafc"/>
  <rect width="960" height="240" rx="18" fill="url(#tbDots)"/>

  <!-- Left Branch Pills -->
  <g filter="url(#tbShadow)">
    <rect x="28" y="66" width="144" height="40" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="100" y="91" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#1d4ed8">main (trunk)</text>

    <rect x="28" y="156" width="144" height="40" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="100" y="181" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#059669">short-lived PRs</text>
  </g>

  <!-- Main Trunk Line -->
  <line x1="192" y1="86" x2="922" y2="86" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <polygon points="932,86 918,79 918,93" fill="#2563eb"/>

  <!-- Guide Track for Short-Lived Branches -->
  <line x1="192" y1="176" x2="922" y2="176" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Short-Lived Branch 1 (< 1 day) -->
  <path d="M 230 86 C 250 86, 255 176, 280 176 L 340 176 C 365 176, 370 86, 390 86" fill="none" stroke="#059669" stroke-width="3.5"/>
  <circle cx="310" cy="176" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Short-Lived Branch 2 (with Feature Flag) -->
  <path d="M 450 86 C 470 86, 475 176, 500 176 L 560 176 C 585 176, 590 86, 610 86" fill="none" stroke="#059669" stroke-width="3.5"/>
  <circle cx="530" cy="176" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Short-Lived Branch 3 -->
  <path d="M 670 86 C 690 86, 695 176, 720 176 L 780 176 C 805 176, 810 86, 830 86" fill="none" stroke="#059669" stroke-width="3.5"/>
  <circle cx="750" cy="176" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Commit Nodes on main -->
  <circle cx="230" cy="86" r="9.5" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="390" cy="86" r="9.5" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="450" cy="86" r="9.5" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="610" cy="86" r="9.5" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="670" cy="86" r="9.5" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="830" cy="86" r="9.5" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="890" cy="86" r="9.5" fill="#ffffff" stroke="#10b981" stroke-width="4"/>

  <!-- Continuous Release / Feature Flag Badges -->
  <g filter="url(#tbShadow)">
    <rect x="352" y="28" width="76" height="28" rx="8" fill="#2563eb"/>
    <text x="390" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#ffffff">CI + CD</text>

    <rect x="552" y="28" width="116" height="28" rx="8" fill="#4f46e5"/>
    <text x="610" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#ffffff">Flag: OFF/ON</text>

    <rect x="792" y="28" width="76" height="28" rx="8" fill="#059669"/>
    <text x="830" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#ffffff">Deploy</text>

    <rect x="250" y="194" width="120" height="24" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="310" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">PR &lt; 1 day</text>

    <rect x="462" y="194" width="136" height="24" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="530" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Small batch merge</text>

    <rect x="684" y="194" width="132" height="24" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="750" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Automated checks</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 165" width="960" height="165" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="dvShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="165" rx="16" fill="#f8fafc"/>

  <!-- Row 1: Waterfall -->
  <text x="32" y="42" font-size="18" font-weight="800" fill="#1e293b">Waterfall</text>
  <g filter="url(#dvShadow)">
    <rect x="32" y="56" width="175" height="64" rx="8" fill="#0891b2"/>
    <text x="119.5" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Design</text>

    <rect x="219" y="56" width="352" height="64" rx="8" fill="#1e293b"/>
    <text x="395" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Code</text>

    <rect x="583" y="56" width="165" height="64" rx="8" fill="#dc2626"/>
    <text x="665.5" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Test</text>

    <rect x="760" y="56" width="168" height="64" rx="8" fill="#10b981"/>
    <text x="844" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Deploy</text>
  </g>
</svg>

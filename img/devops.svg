<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="dv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="dv-design" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dv-code" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dv-test" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="dv-deploy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="992" height="382" rx="16" fill="url(#dv-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 1: Waterfall -->
  <text x="36" y="40" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Waterfall</text>
  <rect x="36" y="52" width="180" height="58" rx="9" fill="url(#dv-design)"/>
  <text x="126" y="87" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Design</text>

  <rect x="226" y="52" width="368" height="58" rx="9" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="87" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Code</text>

  <rect x="604" y="52" width="170" height="58" rx="9" fill="url(#dv-test)"/>
  <text x="689" y="87" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Test</text>

  <rect x="784" y="52" width="180" height="58" rx="9" fill="url(#dv-deploy)"/>
  <text x="874" y="87" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- Row 2: Agile (Iterative Design -> Code -> Test, then single Deploy at the end) -->
  <text x="36" y="156" fill="#818cf8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Agile</text>

  <!-- Agile Iteration 1 -->
  <rect x="36" y="168" width="74" height="58" rx="8" fill="url(#dv-design)"/>
  <text x="73" y="202" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Design</text>
  <rect x="115" y="168" width="74" height="58" rx="8" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="152" y="202" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Code</text>
  <rect x="194" y="168" width="74" height="58" rx="8" fill="url(#dv-test)"/>
  <text x="231" y="202" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test</text>

  <!-- Agile Iteration 2 -->
  <rect x="286" y="168" width="74" height="58" rx="8" fill="url(#dv-design)"/>
  <text x="323" y="202" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Design</text>
  <rect x="365" y="168" width="74" height="58" rx="8" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="402" y="202" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Code</text>
  <rect x="444" y="168" width="74" height="58" rx="8" fill="url(#dv-test)"/>
  <text x="481" y="202" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test</text>

  <!-- Agile Iteration 3 -->
  <rect x="536" y="168" width="74" height="58" rx="8" fill="url(#dv-design)"/>
  <text x="573" y="202" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Design</text>
  <rect x="615" y="168" width="74" height="58" rx="8" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="652" y="202" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Code</text>
  <rect x="694" y="168" width="74" height="58" rx="8" fill="url(#dv-test)"/>
  <text x="731" y="202" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test</text>

  <!-- Agile Final Deploy -->
  <rect x="786" y="168" width="178" height="58" rx="9" fill="url(#dv-deploy)"/>
  <text x="875" y="203" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- Row 3: DevOps (Design -> Code -> Test -> Deploy each time) -->
  <text x="36" y="272" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">DevOps</text>

  <!-- DevOps Iteration 1: Design, Code, Test, Deploy -->
  <rect x="36" y="284" width="70" height="58" rx="8" fill="url(#dv-design)"/>
  <text x="71" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Design</text>
  <rect x="111" y="284" width="70" height="58" rx="8" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="146" y="318" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Code</text>
  <rect x="186" y="284" width="70" height="58" rx="8" fill="url(#dv-test)"/>
  <text x="221" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test</text>
  <rect x="261" y="284" width="70" height="58" rx="8" fill="url(#dv-deploy)"/>
  <text x="296" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- DevOps Iteration 2: Design, Code, Test, Deploy -->
  <rect x="352" y="284" width="70" height="58" rx="8" fill="url(#dv-design)"/>
  <text x="387" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Design</text>
  <rect x="427" y="284" width="70" height="58" rx="8" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="462" y="318" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Code</text>
  <rect x="502" y="284" width="70" height="58" rx="8" fill="url(#dv-test)"/>
  <text x="537" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test</text>
  <rect x="577" y="284" width="70" height="58" rx="8" fill="url(#dv-deploy)"/>
  <text x="612" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- DevOps Iteration 3: Design, Code, Test, Deploy -->
  <rect x="669" y="284" width="70" height="58" rx="8" fill="url(#dv-design)"/>
  <text x="704" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Design</text>
  <rect x="744" y="284" width="70" height="58" rx="8" fill="url(#dv-code)" stroke="#475569" stroke-width="1.5"/>
  <text x="779" y="318" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Code</text>
  <rect x="819" y="284" width="70" height="58" rx="8" fill="url(#dv-test)"/>
  <text x="854" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Test</text>
  <rect x="894" y="284" width="70" height="58" rx="8" fill="url(#dv-deploy)"/>
  <text x="929" y="318" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Deploy</text>
</svg>

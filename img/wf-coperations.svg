<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="100%">
  <defs>
    <linearGradient id="co-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="co-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="co-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="992" height="422" rx="18" fill="url(#co-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- All 7 Stage Boxes Active, Operate Highlighted -->
  <rect x="28" y="26" width="124" height="54" rx="10" fill="url(#co-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="59" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Plan</text>

  <rect x="164" y="26" width="124" height="54" rx="10" fill="url(#co-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="226" y="59" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Code</text>

  <rect x="300" y="26" width="124" height="54" rx="10" fill="url(#co-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="362" y="59" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Build</text>

  <rect x="436" y="26" width="124" height="54" rx="10" fill="url(#co-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="498" y="59" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Test</text>

  <rect x="572" y="26" width="124" height="54" rx="10" fill="url(#co-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="634" y="59" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Release</text>

  <rect x="708" y="26" width="124" height="54" rx="10" fill="url(#co-active)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="770" y="59" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- Stage 7: Operate (Highlighted target stage) -->
  <rect x="844" y="26" width="128" height="54" rx="10" fill="url(#co-highlight)" stroke="#ffffff" stroke-width="2"/>
  <text x="908" y="59" fill="#090d16" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Operate</text>

  <!-- Vertical Dashed Guide Lines -->
  <line x1="424" y1="88" x2="424" y2="145" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="560" y1="88" x2="560" y2="205" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="696" y1="88" x2="696" y2="265" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="832" y1="88" x2="832" y2="325" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="972" y1="88" x2="972" y2="402" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Scope 1: Agile Development -->
  <text x="226" y="120" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Agile Development</text>
  <line x1="36" y1="134" x2="416" y2="134" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="28,134 40,128 40,140" fill="#64748b"/>
  <polygon points="424,134 412,128 412,140" fill="#64748b"/>

  <!-- Scope 2: Continuous Integration -->
  <text x="294" y="180" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Continuous Integration</text>
  <line x1="36" y1="194" x2="552" y2="194" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="28,194 40,188 40,200" fill="#64748b"/>
  <polygon points="560,194 548,188 548,200" fill="#64748b"/>

  <!-- Scope 3: Continuous Delivery -->
  <text x="362" y="240" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Continuous Delivery</text>
  <line x1="36" y1="254" x2="688" y2="254" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="28,254 40,248 40,260" fill="#64748b"/>
  <polygon points="696,254 684,248 684,260" fill="#64748b"/>

  <!-- Scope 4: Continuous Deployment -->
  <text x="430" y="300" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Continuous Deployment</text>
  <line x1="36" y1="314" x2="824" y2="314" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="28,314 40,308 40,320" fill="#94a3b8"/>
  <polygon points="832,314 820,308 820,320" fill="#94a3b8"/>

  <!-- Scope 5: Continuous Operations - HIGHLIGHTED -->
  <rect x="340" y="346" width="320" height="32" rx="16" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="368" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Continuous Operations</text>
  <line x1="36" y1="392" x2="964" y2="392" stroke="#fbbf24" stroke-width="4"/>
  <polygon points="28,392 42,385 42,399" fill="#fbbf24"/>
  <polygon points="972,392 958,385 958,399" fill="#fbbf24"/>
</svg>

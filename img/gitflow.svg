<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="gfDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="gfShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect width="960" height="400" rx="18" fill="url(#gfDots)"/>

  <!-- Left Branch Pills -->
  <g filter="url(#gfShadow)">
    <rect x="28" y="44" width="128" height="38" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="92" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#1d4ed8">main</text>

    <rect x="28" y="114" width="128" height="38" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="92" y="138" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#dc2626">hotfix/*</text>

    <rect x="28" y="184" width="128" height="38" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="92" y="208" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#d97706">release/*</text>

    <rect x="28" y="254" width="128" height="38" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="92" y="278" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#4f46e5">develop</text>

    <rect x="28" y="324" width="128" height="38" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="92" y="348" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#059669">feature/*</text>
  </g>

  <!-- Horizontal Guide Tracks -->
  <line x1="175" y1="63" x2="925" y2="63" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="175" y1="133" x2="925" y2="133" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="175" y1="203" x2="925" y2="203" stroke="#fcd34d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="175" y1="273" x2="925" y2="273" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="175" y1="343" x2="925" y2="343" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Branching & Merging Paths -->
  <path d="M 200 63 C 225 63, 225 273, 250 273" fill="none" stroke="#4f46e5" stroke-width="3.5"/>
  <path d="M 200 63 C 245 63, 260 133, 320 133 C 365 133, 375 63, 410 63" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <path d="M 320 133 C 365 133, 375 273, 410 273" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M 300 273 C 330 273, 340 343, 375 343 L 490 343 C 520 343, 530 273, 555 273" fill="none" stroke="#059669" stroke-width="3.5"/>
  <path d="M 555 273 C 585 273, 595 203, 630 203 L 720 203 C 755 203, 765 63, 795 63" fill="none" stroke="#d97706" stroke-width="3.5"/>
  <path d="M 720 203 C 755 203, 765 273, 795 273" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M 630 273 C 660 273, 670 343, 700 343 L 820 343 C 850 343, 860 273, 890 273" fill="none" stroke="#059669" stroke-width="3.5"/>

  <!-- Commit Nodes on main -->
  <circle cx="200" cy="63" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="410" cy="63" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="795" cy="63" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>

  <!-- Version Tags on main -->
  <g filter="url(#gfShadow)">
    <rect x="170" y="18" width="60" height="26" rx="8" fill="#2563eb"/>
    <text x="200" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">v1.0</text>

    <rect x="377" y="18" width="66" height="26" rx="8" fill="#dc2626"/>
    <text x="410" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">v1.0.1</text>

    <rect x="765" y="18" width="60" height="26" rx="8" fill="#2563eb"/>
    <text x="795" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">v1.1</text>
  </g>

  <!-- Commit Nodes on hotfix / release / develop / feature -->
  <circle cx="320" cy="133" r="8.5" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="630" cy="203" r="8.5" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="720" cy="203" r="8.5" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>

  <circle cx="250" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="300" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="410" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="555" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="630" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="795" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="890" cy="273" r="8.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>

  <circle cx="375" cy="343" r="8.5" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="490" cy="343" r="8.5" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="700" cy="343" r="8.5" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="820" cy="343" r="8.5" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
</svg>

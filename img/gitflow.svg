<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="gfShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="16" fill="#f8fafc"/>

  <!-- Left Branch Pills -->
  <g filter="url(#gfShadow)">
    <rect x="28" y="44" width="124" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="90" y="67" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#1d4ed8">main</text>

    <rect x="28" y="114" width="124" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="90" y="137" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#dc2626">hotfix/*</text>

    <rect x="28" y="184" width="124" height="36" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="90" y="207" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#d97706">release/*</text>

    <rect x="28" y="254" width="124" height="36" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="90" y="277" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#4f46e5">develop</text>

    <rect x="28" y="324" width="124" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="90" y="347" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#059669">feature/*</text>
  </g>

  <!-- Horizontal Guide Tracks -->
  <line x1="175" y1="62" x2="925" y2="62" stroke="#2563eb" stroke-width="4"/>
  <line x1="175" y1="132" x2="925" y2="132" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="175" y1="202" x2="925" y2="202" stroke="#fcd34d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="175" y1="272" x2="925" y2="272" stroke="#4f46e5" stroke-width="4"/>
  <line x1="175" y1="342" x2="925" y2="342" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Branching & Merging Paths -->
  <path d="M 200 62 C 225 62, 225 272, 250 272" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <path d="M 200 62 C 245 62, 260 132, 320 132 C 365 132, 375 62, 410 62" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M 320 132 C 365 132, 375 272, 410 272" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M 300 272 C 330 272, 340 342, 375 342 L 490 342 C 520 342, 530 272, 555 272" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M 555 272 C 585 272, 595 202, 630 202 L 720 202 C 755 202, 765 62, 795 62" fill="none" stroke="#d97706" stroke-width="3"/>
  <path d="M 720 202 C 755 202, 765 272, 795 272" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M 630 272 C 660 272, 670 342, 700 342 L 820 342 C 850 342, 860 272, 890 272" fill="none" stroke="#059669" stroke-width="3"/>

  <!-- Commit Nodes on main -->
  <circle cx="200" cy="62" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="410" cy="62" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="795" cy="62" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>

  <!-- Version Tags on main -->
  <rect x="172" y="20" width="56" height="24" rx="6" fill="#2563eb"/>
  <text x="200" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">v1.0</text>

  <rect x="379" y="20" width="62" height="24" rx="6" fill="#dc2626"/>
  <text x="410" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">v1.0.1</text>

  <rect x="767" y="20" width="56" height="24" rx="6" fill="#2563eb"/>
  <text x="795" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">v1.1</text>

  <!-- Commit Nodes on hotfix / release / develop / feature -->
  <circle cx="320" cy="132" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="630" cy="202" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="720" cy="202" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>

  <circle cx="250" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="300" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="410" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="555" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="630" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="795" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="890" cy="272" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>

  <circle cx="375" cy="342" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="490" cy="342" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="700" cy="342" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="820" cy="342" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="100%" height="100%">
  <defs>
    <linearGradient id="gf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="992" height="402" rx="18" fill="url(#gf-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Branch Labels (Left Column) -->
  <rect x="28" y="46" width="120" height="34" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="68" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">main</text>

  <rect x="28" y="116" width="120" height="34" rx="8" fill="#e11d48" fill-opacity="0.25" stroke="#fb7185" stroke-width="1.5"/>
  <text x="88" y="138" fill="#fb7185" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">hotfix/*</text>

  <rect x="28" y="186" width="120" height="34" rx="8" fill="#d97706" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="88" y="208" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">release/*</text>

  <rect x="28" y="256" width="120" height="34" rx="8" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5"/>
  <text x="88" y="278" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">develop</text>

  <rect x="28" y="326" width="120" height="34" rx="8" fill="#059669" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="348" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" text-anchor="middle">feature/*</text>

  <!-- Guide Track Lines -->
  <line x1="175" y1="63" x2="950" y2="63" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
  <line x1="175" y1="133" x2="950" y2="133" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.35"/>
  <line x1="175" y1="203" x2="950" y2="203" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.35"/>
  <line x1="175" y1="273" x2="950" y2="273" stroke="#818cf8" stroke-width="4" stroke-opacity="0.85"/>
  <line x1="175" y1="343" x2="950" y2="343" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.35"/>

  <!-- Branch / Merge Curves -->
  <!-- main -> develop initial -->
  <path d="M 200 63 C 225 63, 225 273, 250 273" fill="none" stroke="#818cf8" stroke-width="3.5"/>

  <!-- hotfix branch from main to main + develop -->
  <path d="M 200 63 C 235 63, 245 133, 280 133 L 340 133 C 370 133, 375 63, 405 63" fill="none" stroke="#fb7185" stroke-width="3.5"/>
  <path d="M 340 133 C 370 133, 375 273, 405 273" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- feature 1 branch from develop -->
  <path d="M 310 273 C 340 273, 345 343, 375 343 L 505 343 C 535 343, 540 273, 570 273" fill="none" stroke="#34d399" stroke-width="3.5"/>

  <!-- release branch from develop to main & back to develop -->
  <path d="M 570 273 C 600 273, 605 203, 635 203 L 735 203 C 765 203, 770 63, 800 63" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
  <path d="M 735 203 C 765 203, 770 273, 800 273" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- feature 2 branch from develop -->
  <path d="M 660 273 C 690 273, 695 343, 725 343 L 845 343 C 875 343, 880 273, 910 273" fill="none" stroke="#34d399" stroke-width="3.5"/>

  <!-- Commit Nodes: main -->
  <circle cx="200" cy="63" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="405" cy="63" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="800" cy="63" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>

  <!-- Release Version Tags on main -->
  <rect x="172" y="22" width="56" height="24" rx="6" fill="#0284c7"/>
  <text x="200" y="38" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">v1.0</text>

  <rect x="377" y="22" width="56" height="24" rx="6" fill="#e11d48"/>
  <text x="405" y="38" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">v1.0.1</text>

  <rect x="772" y="22" width="56" height="24" rx="6" fill="#0284c7"/>
  <text x="800" y="38" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">v1.1</text>

  <!-- Commit Nodes: hotfix -->
  <circle cx="310" cy="133" r="9" fill="#fb7185" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Commit Nodes: release -->
  <circle cx="655" cy="203" r="9" fill="#fbbf24" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="715" cy="203" r="9" fill="#fbbf24" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Commit Nodes: develop -->
  <circle cx="250" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="310" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="405" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="570" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="660" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="800" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="910" cy="273" r="9" fill="#818cf8" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Commit Nodes: feature -->
  <circle cx="405" cy="343" r="9" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="475" cy="343" r="9" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="755" cy="343" r="9" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="815" cy="343" r="9" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
</svg>

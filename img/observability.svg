<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="obDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="obOtel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="obShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="960" height="250" rx="18" fill="#f8fafc"/>
  <rect width="960" height="250" rx="18" fill="url(#obDots)"/>

  <!-- 3 Pillars Cards on Left -->
  <g filter="url(#obShadow)">
    <!-- Pillar 1: Metrics -->
    <rect x="28" y="22" width="260" height="62" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="34" width="84" height="38" rx="8" fill="#eff6ff"/>
    <text x="82" y="58" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1d4ed8">Metrics</text>
    <text x="136" y="48" font-size="12.5" font-weight="700" fill="#0f172a">WHAT is broken?</text>
    <text x="136" y="67" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#64748b">Prometheus • RED / USE</text>

    <!-- Pillar 2: Logs -->
    <rect x="28" y="94" width="260" height="62" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="40" y="106" width="84" height="38" rx="8" fill="#fffbeb"/>
    <text x="82" y="130" text-anchor="middle" font-size="13.5" font-weight="800" fill="#d97706">Logs</text>
    <text x="136" y="120" font-size="12.5" font-weight="700" fill="#0f172a">WHY did it break?</text>
    <text x="136" y="139" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#64748b">Grafana Loki • OpenSearch</text>

    <!-- Pillar 3: Traces -->
    <rect x="28" y="166" width="260" height="62" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="40" y="178" width="84" height="38" rx="8" fill="#ecfdf5"/>
    <text x="82" y="202" text-anchor="middle" font-size="13.5" font-weight="800" fill="#059669">Traces</text>
    <text x="136" y="192" font-size="12.5" font-weight="700" fill="#0f172a">WHERE did it break?</text>
    <text x="136" y="211" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#64748b">Grafana Tempo • Jaeger</text>
  </g>

  <!-- Converging Lines to OpenTelemetry -->
  <path d="M 288 53 C 330 53, 340 125, 380 125" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="288" y1="125" x2="380" y2="125" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M 288 197 C 330 197, 340 125, 380 125" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Center Hub: OpenTelemetry (OTel) -->
  <g filter="url(#obShadow)">
    <rect x="380" y="55" width="220" height="140" rx="18" fill="url(#obOtel)"/>
    <text x="490" y="92" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">OpenTelemetry</text>
    <text x="490" y="114" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#bfdbfe">OTel SDK &amp; Collector</text>
    <rect x="404" y="130" width="172" height="44" rx="10" fill="#ffffff" fill-opacity="0.14"/>
    <text x="490" y="149" text-anchor="middle" font-size="11" font-weight="600" fill="#f8fafc">Vendor-neutral OTLP</text>
    <text x="490" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#e0e7ff">Context Correlation</text>
  </g>

  <!-- Arrow to Unified Observability & Action -->
  <line x1="600" y1="125" x2="662" y2="125" stroke="#4f46e5" stroke-width="3"/>
  <polygon points="672,125 660,119 660,131" fill="#4f46e5"/>

  <!-- Right Box: Correlation, SLOs & Action -->
  <g filter="url(#obShadow)">
    <rect x="674" y="38" width="258" height="174" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="694" y="54" width="218" height="30" rx="8" fill="#f5f3ff"/>
    <text x="803" y="74" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4338ca">Unified Observability</text>
    <text x="803" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#0f172a">Grafana • Datadog</text>
    <text x="803" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">• Correlated Trace ↔ Log ↔ Metric</text>
    <text x="803" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">• SLI / SLO &amp; Burn-Rate Alerts</text>
    <text x="803" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">• Automated Rollback &amp; Scaling</text>
  </g>
</svg>

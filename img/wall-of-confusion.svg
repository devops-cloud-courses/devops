<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="wc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="wc-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wc-ops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wc-brick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="992" height="412" rx="18" fill="url(#wc-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Side: DEV -->
  <rect x="36" y="40" width="360" height="270" rx="16" fill="url(#wc-dev)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="216" cy="105" r="36" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <text x="216" y="114" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  <text x="216" y="172" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">DEV</text>
  <text x="216" y="204" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Driven by Change &amp; Speed</text>
  <text x="216" y="242" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">"It works on my machine!"</text>
  <text x="216" y="268" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">Ship new features fast</text>

  <!-- Right Side: OPS -->
  <rect x="604" y="40" width="360" height="270" rx="16" fill="url(#wc-ops)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="784" cy="105" r="36" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>
  <text x="784" y="114" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" text-anchor="middle">⚙</text>
  <text x="784" y="172" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">OPS</text>
  <text x="784" y="204" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Driven by Stability &amp; Uptime</text>
  <text x="784" y="242" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">"Don't touch production!"</text>
  <text x="784" y="268" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">Keep systems reliable &amp; secure</text>

  <!-- Center: The Wall of Confusion being broken -->
  <text x="500" y="54" fill="#fb7185" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.08em">WALL OF CONFUSION</text>

  <!-- Bricks stack -->
  <rect x="445" y="75" width="52" height="26" rx="4" fill="url(#wc-brick)" transform="rotate(-12 471 88)"/>
  <rect x="505" y="72" width="52" height="26" rx="4" fill="url(#wc-brick)" transform="rotate(15 531 85)"/>
  <rect x="465" y="112" width="70" height="26" rx="4" fill="url(#wc-brick)" transform="rotate(-4 500 125)"/>
  <rect x="442" y="148" width="52" height="26" rx="4" fill="url(#wc-brick)"/>
  <rect x="502" y="148" width="54" height="26" rx="4" fill="url(#wc-brick)" transform="rotate(6 529 161)"/>
  <rect x="458" y="182" width="84" height="26" rx="4" fill="url(#wc-brick)"/>
  <rect x="442" y="216" width="52" height="26" rx="4" fill="url(#wc-brick)"/>
  <rect x="502" y="216" width="54" height="26" rx="4" fill="url(#wc-brick)"/>
  <rect x="458" y="250" width="84" height="26" rx="4" fill="url(#wc-brick)"/>

  <!-- Curved arrow over the wall -->
  <path d="M 350 75 Q 500 10 645 75" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="645,75 633,66 636,80" fill="#fbbf24"/>

  <!-- Bottom DevOps Bridge Banner -->
  <rect x="140" y="334" width="720" height="54" rx="27" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="500" y="367" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🤝 DevOps: Shared Culture, Automation &amp; End-to-End Ownership
  </text>
</svg>
